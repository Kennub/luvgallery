<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/recovery.css">
    <link href="css/themify-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&display=swap" rel="stylesheet">
    <title>Recovery</title>
</head>
<body>
    <h1 class="text" id="typing"></h1>
    <ul id="listed"></ul>
    <div id="forward"></div>
</body>
<script>
    const duration = 10
    const forward = document.getElementById("forward");
    function type(_text, _dur, _ind = 0) {
            if (_ind < _text.length) {
                document.getElementById("typing").innerHTML += _text.charAt(_ind);
                _ind++;
                setTimeout(() => type(_text, _dur, _ind), _dur);
            }
        }
    if (localStorage.getItem("data4Done") === "true"){
        const text = "Hệ thống đã được khôi phục hoàn chỉnh, giờ bạn có thể bấm vào nút bên dưới để truy cập vào hệ thống!";
        forward.innerHTML = '<a href="main.html" class="forward-btn">Vào hệ thống</a>';
        type(text, duration);
    } else {  
        const text = "Chào mừng bạn tới với hệ thống, rất xin lỗi bạn vì sự cố hiện tại. Hiện tại hệ thống đang gặp một số trục trặc nhất định. Để truy cập vào hệ thống, bạn có thể tự mình khôi phục những vùng dữ liệu còn thiếu, giúp hệ thống vận hành. Dưới đây là những mục còn bị thiếu:";
        const list = '<li><a href="data1.html" class="data" class="text"><i class="ti-folder"></i>   Data 1</a></li><li><a href="data2.html" class="data" class="text"><i class="ti-folder"></i>   Data 2</a></li><li><a href="data3.html" class="data" class="text"><i class="ti-folder"></i>   Data 3</a></li><li><a href="data4.html" class="data" class="text"><i class="ti-folder"></i>   Data 4</a></li>'
        document.getElementById("listed").innerHTML += list
        forward.innerHTML = "";
        type(text, duration);
    }
    </script>
</html>
