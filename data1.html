<body>
    <h1 id="announce" class="text"></h1>
    <div class="img"></div>
    <a href="../img/anni 6m idea img/chall1.JPEG" download="chall1.JPEG" class="download-btn">Tải xuống ảnh</a>
    <input type="text" class="answer-input" placeholder="Mật khẩu">
    <button class="submit-btn">Kiểm tra</button>
</body>
<script>
    passedMessage = "Đã khôi phục lại data1!"
    failedMessage = "Hãy tìm ra bí mật trong bức ảnh này"
    let password = document.querySelector(".answer-input").value;
    let button = document.querySelector(".submit-btn");
    button.onclick = function() {
        password = document.querySelector(".answer-input").value;
        if (password === "them_da") {
            document.getElementById("announce").innerHTML += passedMessage
            localStorage.setItem("data1Done", "true");
        } else {
            document.getElementById("announce").innerHTML += failedMessage
        }
    }
    
</script>
