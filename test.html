<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Book</title>

<style>

body {
  margin: 0;
  font-family: "Courier New", monospace;
  background: #121417;
  color: #2b2b2b;
}

/* Khung sách */
.book {
  width: 100%;
  height: 100vh;
  background: #f5f1ea;

  display: flex;
  justify-content: center;
  align-items: center;

  position: relative;
  overflow: hidden;
}

/* Trang */
.page {
  width: 90%;
  max-width: 500px;
  height: 90%;

  background: #fffdf7;
  padding: 25px;

  border-radius: 12px;
  box-shadow: 0 0 30px rgba(0,0,0,0.15);

  position: absolute;

  opacity: 0;
  pointer-events: none;

  transition: opacity 0.8s ease;
}

/* Trang đang hiện */
.page.active {
  opacity: 1;
  pointer-events: auto;
}

/* Nút */
button {
  margin-top: 30px;
  padding: 12px 25px;

  border: none;
  border-radius: 25px;

  background: #ff6f91;
  color: white;

  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

h2 {
  margin-top: 0;
}

</style>
</head>

<body>

<div class="book">

  <!-- PAGE 1 -->
  <div class="page active">

    <h2>📖 Page 1</h2>

    <p>
      Ngày đó, anh không nghĩ rằng<br>
      một tin nhắn nhỏ…<br>
      lại có thể thay đổi cả cuộc đời.
    </p>

    <button onclick="nextPage()">Tiếp tục →</button>

  </div>

  <!-- PAGE 2 -->
  <div class="page">

    <h2>💗 Page 2</h2>

    <p>
      Rồi chúng ta nói chuyện mỗi ngày,<br>
      cười với nhau nhiều hơn,<br>
      quan tâm nhau nhiều hơn…
    </p>

    <button onclick="nextPage()">Tiếp tục →</button>

  </div>

  <!-- PAGE 3 -->
  <div class="page">

    <h2>🌸 Page 3</h2>

    <p>
      Và anh nhận ra…<br>
      anh không muốn đi tiếp nếu thiếu em.
    </p>

    <button onclick="restart()">Từ đầu 💞</button>

  </div>

</div>


<script>

let current = 0;
const pages = document.querySelectorAll(".page");

function showPage(i) {

  pages.forEach(p => p.classList.remove("active"));

  pages[i].classList.add("active");

  localStorage.setItem("page", i);
}

function nextPage() {

  if (current >= pages.length - 1) return;

  current++;

  showPage(current);
}

function restart() {

  current = 0;

  showPage(current);
}

window.onload = () => {

  const saved = localStorage.getItem("page");

  if (saved) current = Number(saved);

  showPage(current);
}


</script>

</body>
</html>
